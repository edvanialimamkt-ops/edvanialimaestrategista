<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Consultoria de Marca — Edvânia Lima</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --choc:        #3B1F14;
      --choc-mid:    #5C2E1A;
      --choc-light:  #7A3E26;
      --beige:       #F5EFE6;
      --beige-mid:   #EDE4D8;
      --beige-dark:  #E0D4C3;
      --gold:        #C9A96E;
      --gold-light:  #E2C98A;
      --gold-pale:   #F0E4C8;
      --gold-faint:  #FAF5EC;
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Jost', sans-serif;
      background: var(--beige);
      color: var(--choc);
      overflow-x: hidden;
    }

    /* ── GRAIN OVERLAY ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }

    /* ── HERO ── */
    .hero {
      position: relative;
      min-height: 85vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 100px 24px 40px;
      text-align: center;
      overflow: hidden;
    }

    .hero::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0; right: 0;
      height: 80px;
      background: linear-gradient(to bottom, transparent, var(--beige));
      z-index: 1;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 60% at 50% 0%, rgba(201,169,110,0.18) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 80% 90%, rgba(59,31,20,0.07) 0%, transparent 60%);
    }

    /* ornament lines */
    .hero-lines {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
    }
    .hero-lines::before,
    .hero-lines::after {
      content: '';
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 1px;
      background: linear-gradient(to bottom, transparent, rgba(201,169,110,0.3), transparent);
    }
    .hero-lines::before { top: 0; height: 30%; }
    .hero-lines::after  { bottom: 0; height: 30%; }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 680px;
      animation: riseIn 1s cubic-bezier(0.16,1,0.3,1) both;
    }

    @keyframes riseIn {
      from { opacity:0; transform: translateY(40px); }
      to   { opacity:1; transform: translateY(0); }
    }

    .eyebrow {
      font-size: 0.65rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .eyebrow::before, .eyebrow::after {
      content: '';
      width: 32px;
      height: 1px;
      background: var(--gold);
      opacity: 0.6;
    }

    .hero h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.8rem, 8vw, 5rem);
      font-weight: 300;
      line-height: 1.08;
      color: var(--choc);
      letter-spacing: 0.01em;
      margin-bottom: 8px;
    }
    .hero h1 em {
      font-style: italic;
      color: var(--choc-mid);
    }

    .hero-sub {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(1.1rem, 3vw, 1.4rem);
      font-weight: 300;
      color: var(--choc-light);
      margin-top: 20px;
      line-height: 1.6;
      max-width: 520px;
      margin-left: auto;
      margin-right: auto;
    }

    .hero-divider {
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 28px auto;
    }

    .hero-cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 15px 36px;
      background: var(--choc);
      color: var(--gold-light);
      font-family: 'Jost', sans-serif;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-decoration: none;
      border: 1px solid var(--choc);
      transition: all 0.35s ease;
      margin-top: 32px;
    }
    .hero-cta:hover {
      background: transparent;
      color: var(--choc);
      border-color: var(--gold);
      transform: translateY(-2px);
    }
    .hero-cta span { transition: transform 0.3s ease; }
    .hero-cta:hover span { transform: translateX(4px); }

    /* ── SECTIONS common ── */
    section {
      position: relative;
      z-index: 1;
      padding: 80px 24px;
    }

    section.proposta-section {
      padding-top: 40px; 
    }

    .inner {
      max-width: 720px;
      margin: 0 auto;
    }

    .section-label {
      font-size: 0.63rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 14px;
    }

    .section-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.9rem, 5vw, 2.8rem);
      font-weight: 400;
      line-height: 1.15;
      color: var(--choc);
      margin-bottom: 20px;
    }
    .section-title em { font-style: italic; }

    .section-text {
      font-size: 0.95rem;
      line-height: 1.85;
      color: var(--choc-mid);
      font-weight: 300;
    }

    .thin-rule {
      width: 48px;
      height: 1px;
      background: var(--gold);
      opacity: 0.5;
      margin: 32px 0;
    }

    /* ── PARA QUEM É ── */
    .para-quem { background: var(--beige-mid); }

    .pain-list {
      list-style: none;
      margin-top: 36px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .pain-item {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      padding: 22px 0;
      border-bottom: 1px solid rgba(201,169,110,0.2);
      opacity: 0;
      transform: translateX(-16px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .pain-item.visible {
      opacity: 1;
      transform: translateX(0);
    }
    .pain-item:first-child { border-top: 1px solid rgba(201,169,110,0.2); }

    .pain-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.8rem;
      font-weight: 300;
      color: var(--gold);
      letter-spacing: 0.1em;
      min-width: 28px;
      padding-top: 2px;
    }

    .pain-text {
      font-size: 0.92rem;
      line-height: 1.65;
      color: var(--choc);
      font-weight: 300;
    }

    /* ── O QUE ESTÁ INCLUÍDO ── */
    .included { background: var(--beige); }

    .steps-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
      margin-top: 40px;
    }

    @media (max-width: 560px) {
      .steps-grid { grid-template-columns: 1fr; }
    }

    .step-card {
      background: var(--beige-mid);
      padding: 32px 28px;
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .step-card.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .step-card:hover { background: var(--beige-dark); }

    .step-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, var(--gold) 0%, transparent 100%);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .step-card:hover::before { opacity: 1; }

    .step-number {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.8rem;
      font-weight: 300;
      color: rgba(201,169,110,0.25);
      line-height: 1;
      margin-bottom: 14px;
    }

    .step-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.25rem;
      font-weight: 500;
      color: var(--choc);
      margin-bottom: 10px;
      letter-spacing: 0.02em;
    }

    .step-desc {
      font-size: 0.82rem;
      line-height: 1.7;
      color: var(--choc-mid);
      font-weight: 300;
    }

    /* ── QUOTE ── */
    .quote-section {
      background: var(--choc);
      padding: 80px 24px;
      text-align: center;
    }

    .quote-mark {
      font-family: 'Cormorant Garamond', serif;
      font-size: 5rem;
      color: var(--gold);
      opacity: 0.3;
      line-height: 0.6;
      display: block;
      margin-bottom: 24px;
    }

    .quote-text {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 300;
      color: var(--beige);
      max-width: 560px;
      margin: 0 auto;
      line-height: 1.55;
    }

    .quote-author {
      margin-top: 28px;
      font-size: 0.65rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0.8;
    }

    /* ── CTA FINAL ── */
    .cta-final {
      background: var(--beige);
      text-align: center;
      padding: 100px 24px;
    }

    .cta-final .section-title {
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
      margin-bottom: 12px;
    }

    .cta-final .section-text {
      max-width: 400px;
      margin: 0 auto 40px;
      text-align: center;
    }

    .wa-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 16px 40px;
      background: var(--choc);
      color: var(--gold-light);
      font-family: 'Jost', sans-serif;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-decoration: none;
      transition: all 0.35s ease;
      border: 1px solid var(--choc);
    }
    .wa-btn:hover {
      background: transparent;
      color: var(--choc);
      border-color: var(--gold);
      transform: translateY(-2px);
    }
