<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edvânia Lima</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --chocolate: #3B1F14;
      --chocolate-mid: #5C2E1A;
      --beige: #F5EFE6;
      --beige-dark: #E8DDD0;
      --gold: #C9A96E;
      --gold-light: #E2C98A;
      --gold-pale: #F0E4C8;
      --text-dark: #2A1508;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background-color: var(--beige);
      background-image:
        radial-gradient(ellipse at 20% 0%, rgba(201,169,110,0.12) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 100%, rgba(59,31,20,0.08) 0%, transparent 60%);
      font-family: 'Jost', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      animation: fadeUp 0.9s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Avatar ── */
    .avatar-wrap {
      position: relative;
      width: 110px;
      height: 110px;
      margin-bottom: 22px;
    }
    .avatar-ring {
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      background: conic-gradient(var(--gold), var(--gold-light), var(--chocolate-mid), var(--gold));
      animation: spin 8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .avatar-inner {
      position: relative;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: var(--beige-dark);
      border: 4px solid var(--beige);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 42px;
      font-weight: 300;
      color: var(--chocolate);
      letter-spacing: 0.02em;
      z-index: 1;
    }

    /* ── Name & title ── */
    .name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      font-weight: 400;
      color: var(--chocolate);
      letter-spacing: 0.04em;
      text-align: center;
      line-height: 1.15;
    }
    .name em {
      font-style: italic;
      color: var(--gold);
    }

    .divider {
      width: 48px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 14px auto;
    }

    .title {
      font-family: 'Jost', sans-serif;
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--chocolate-mid);
      text-align: center;
      opacity: 0.85;
    }

    .location {
      margin-top: 12px;
      font-family: 'Jost', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--chocolate-mid);
      opacity: 0.7;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .location-dot {
      font-size: 0.45rem;
      color: var(--gold);
      opacity: 1;
    }

    .bio {
      margin-top: 18px;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.05rem;
      font-weight: 300;
      color: var(--chocolate);
      text-align: center;
      line-height: 1.7;
      opacity: 0.9;
      padding: 0 8px;
    }

    /* ── Links ── */
    .links {
      margin-top: 32px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 22px;
      border-radius: 2px;
      text-decoration: none;
      font-family: 'Jost', sans-serif;
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .link-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(201,169,110,0.08) 100%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .link-btn:hover::before { opacity: 1; }

    .link-btn.primary {
      background: var(--chocolate);
      color: var(--gold-light);
      border: 1px solid var(--chocolate);
    }
    .link-btn.primary:hover {
      background: var(--chocolate-mid);
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(59,31,20,0.25);
    }

    .link-btn.secondary {
      background: transparent;
      color: var(--chocolate);
      border: 1px solid var(--gold);
    }
    .link-btn.secondary:hover {
      background: var(--gold-pale);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(201,169,110,0.2);
    }

    .link-label { position: relative; z-index: 1; }

    .link-arrow {
      font-size: 0.9rem;
      opacity: 0.5;
      transition: transform 0.3s ease, opacity 0.3s ease;
      position: relative;
      z-index: 1;
    }
    .link-btn:hover .link-arrow {
      transform: translateX(4px);
      opacity: 1;
    }

    /* ── Footer ── */
    .footer {
      margin-top: 40px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .footer-line {
      width: 36px;
      height: 1px;
      background: var(--gold);
      opacity: 0.4;
    }
    .footer-text {
      font-family: 'Jost', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--chocolate);
      opacity: 0.4;
    }

    .link-btn.whatsapp {
      background: transparent;
      color: var(--chocolate);
      border: 1px solid var(--gold);
    }
    .link-btn.whatsapp:hover {
      background: var(--gold-pale);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(201,169,110,0.2);
    }

    /* stagger de entrada nos links */
    .links .link-btn:nth-child(1) { animation: fadeUp 0.8s 0.2s ease both; }
    .links .link-btn:nth-child(2) { animation: fadeUp 0.8s 0.34s ease both; }
  </style>
</head>
<body>
  <div class="container">

    <!-- Avatar -->
    <div class="avatar-wrap">
      <div class="avatar-ring"></div>
      <div class="avatar-inner">EL</div>
      <!-- Para usar sua foto, substitua a div acima por:
      <img src="sua-foto.jpg" alt="Edvânia Lima" style="width:110px;height:110px;border-radius:50%;object-fit:cover;border:4px solid var(--beige);position:relative;z-index:1;"> -->
    </div>

    <!-- Nome e cargo -->
    <h1 class="name"><em>Edvânia</em> Lima</h1>
    <div class="divider"></div>
    <p class="title">Estrategista de Marca &amp; Posicionamento</p>

    <!-- Localização -->
    <p class="location">
      <span class="location-dot">◆</span> Salvador, BA
    </p>

    <!-- Bio curta -->
    <p class="bio">
      Ajudo marcas a encontrar sua essência<br>
      e ocupar seu lugar de autoridade.
    </p>

    <!-- Links -->
    <div class="links">

      <!-- CONSULTORIA — CTA principal -->
      <a href="#" class="link-btn primary">
        <span class="link-label">✦ &nbsp; Consultoria de Marca &amp; Posicionamento</span>
        <span class="link-arrow">→</span>
      </a>

      <!-- WHATSAPP — substitua SEU_NUMERO pelo número com DDI+DDD, ex: 5571999999999 -->
      <a href="https://wa.me/SEU_NUMERO?text=Ol%C3%A1%2C%20Edv%C3%A2nia!%20Vim%20pelo%20seu%20Instagram%20e%20gostaria%20de%20saber%20mais." class="link-btn whatsapp" target="_blank" rel="noopener">

          Fale comigo no WhatsApp
        </span>
        <span class="link-arrow">→</span>
      </a>

    </div>

    <!-- Rodapé -->
    <div class="footer">
      <div class="footer-line"></div>
      <span class="footer-text">Edvânia Lima</span>
      <div class="footer-line"></div>
    </div>

  </div>
</body>
</html>
